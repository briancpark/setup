# ~/.tmux.conf — tuned for Ghostty + Claude Code

# ── General ──────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"      # true color
set -sg escape-time 0                          # no lag after Escape in TUIs
set -g history-limit 200000                    # default 2000 is uselessly small
set -g base-index 1                            # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Claude Code / Ghostty passthrough ────────────────────────────────
set -g allow-passthrough on                    # desktop notifications reach Ghostty
set -s extended-keys on                        # Shift+Enter etc. inside tmux
set -as terminal-features 'xterm*:extkeys'

# ── Clipboard (OSC 52 — copies reach the local machine over SSH) ─────
set -g set-clipboard on
set -ga terminal-features ',*:clipboard'

# ── Mouse & scrolling ────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi

# wheel-up enters copy mode; scrolling back past the bottom exits it (-e)
bind -n WheelUpPane if -Ft= '#{?mouse_any_flag,1,#{?pane_in_mode,1,0}}' \
  'send -M' 'copy-mode -e'

# finest scroll granularity: 1 line per scroll event (trackpad-friendly)
bind -T copy-mode-vi WheelUpPane   send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

# drag-select copies without the selection vanishing on release
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# vi-style copy: v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Quality of life ──────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "reloaded"

# splits open in the current pane's directory, with memorable keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
